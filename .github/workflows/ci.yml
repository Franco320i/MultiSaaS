# Pipeline de CI (diseño, sección 13): corre en cada PR y en cada push a main y staging.
# Si un paso falla, no se fusiona ni se despliega (las reglas de protección de rama se
# configuran en GitHub, etapa 10b).
#
# Orden: estática → base desde cero → pgTAP → integración → build → E2E de humo.
name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Verificación completa
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks revisa la historia

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Dependencias
        run: npm ci

      # --- 1. Estática (capa 5) ---------------------------------------------------
      # Imagen oficial con versión fija, sobre toda la historia (es chica). No se usa
      # gitleaks-action: en el primer push de una rama arma un rango desde el padre del
      # primer commit, que no existe, y falla sin revisar nada.
      - name: Secretos en el repositorio (gitleaks)
        # safe.directory: el contenedor corre como root y los archivos son del runner.
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner

      - name: Variables NEXT_PUBLIC_ con nombre de secreto
        run: npm run check:env

      - name: Vulnerabilidades en dependencias de producción
        run: npm audit --omit=dev --audit-level=low

      # --- 2. Supabase local y base desde cero ----------------------------------------
      - name: Levantar Supabase local
        run: npx supabase start

      - name: Variables de entorno de la corrida (.env.local)
        run: |
          eval "$(npx supabase status -o env 2>/dev/null)"
          {
            echo "ROOT_DOMAIN=localhost"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "NEXT_PUBLIC_IMAGES_BASE_URL=$API_URL/storage/v1/object/public/catalog-public"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA"
            echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA"
            echo "IP_HASH_SALT=$(openssl rand -base64 24)"
            echo "CRON_SECRET=$(openssl rand -base64 24)"
          } > .env.local

      - name: Tipos, lint y pruebas unitarias
        run: npm run check

      - name: Migraciones desde cero + seed
        run: npm run db:reset

      # --- 3. pgTAP (capas 1 y 2): justo después del reset, cuentan sobre el seed --------
      - name: Pruebas de esquema y RLS (pgTAP)
        run: npm run db:test

      - name: Linter de la base
        run: npm run db:lint

      - name: Advisors de seguridad y rendimiento
        run: npm run db:advisors

      - name: Tipos generados sin diferencias con el esquema
        run: npm run check:types

      # --- 4. Integración (capa 3) ------------------------------------------------------
      - name: Pruebas de integración
        run: npm run test:integration

      # --- 5. Build y lo que quedó fijo en él ---------------------------------------------
      - name: Build de producción
        run: npm run build

      - name: Sin datos de comercios ni secretos en el build
        run: npm run check:build

      # --- 6. E2E de humo (capa 4) --------------------------------------------------------
      - name: Navegador para Playwright
        run: npx playwright install --with-deps chromium

      - name: Base limpia para E2E
        run: npm run db:reset

      - name: Recorridos E2E
        run: npm run test:e2e

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Diseño, sección 14, paso 2: al subir a `staging`, y solo si CI pasó, se aplican las
  # migraciones nuevas al proyecto de Supabase de staging. Vercel despliega por su cuenta.
  # Secretos del repositorio (GitHub → Settings → Secrets and variables → Actions):
  #   SUPABASE_ACCESS_TOKEN  token personal de supabase.com/dashboard/account/tokens
  #   STAGING_PROJECT_REF    identificador del proyecto (el que aparece en su URL)
  #   STAGING_DB_PASSWORD    contraseña de la base del proyecto de staging
  # `db push` no carga supabase/seed.sql: en staging no van los usuarios de prueba.
  migrate-staging:
    name: Migraciones en staging
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: migrate-staging
      cancel-in-progress: false # nunca cortar una migración a la mitad
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Secretos configurados
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            if [ -z "${!name}" ]; then echo "::error::Falta el secreto para $name (ver comentario del job)"; exit 1; fi
          done

      - name: Vincular el proyecto de staging
        run: npx supabase link --project-ref "$PROJECT_REF"

      - name: Migraciones pendientes
        run: npx supabase migration list

      - name: Aplicar migraciones
        run: npx supabase db push
